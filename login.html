<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | PEC Gestão de Casos</title>

    <meta name="description" content="Acesso ao PEC Gestão de Casos">

    <link rel="stylesheet" href="./css/base.css">

    <link rel="stylesheet" href="./css/login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-intro">

            <div class="login-intro-content">

                <img src="./assets/img/logo-pec-h.png" alt="PEC - Programa Escola Consciente" class="login-brand">

                <div class="intro-text">

                    <span class="intro-label">
                        Gestão de Casos
                    </span>

                    <h1>
                        Cuidado começa com uma escuta atenta.
                    </h1>

                    <p>
                        Um ambiente seguro para registrar, acompanhar e conduzir situações com organização e acolhimento.
                    </p>

                </div>

            </div>

            <div class="intro-decoration decoration-one"></div>
            <div class="intro-decoration decoration-two"></div>

        </section>


        <section class="login-area">

            <div class="login-card">

                <div class="login-header">

                    <span class="login-mobile-label">
                        PEC Gestão de Casos
                    </span>

                    <h2>
                        Bem-vindo
                    </h2>

                    <p>
                        Entre com seu acesso institucional.
                    </p>

                </div>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <input type="email" id="email" name="email" placeholder="seuemail@escola.com.br" autocomplete="email" required>

                    </div>


                    <div class="form-group">

                        <div class="password-label">

                            <label for="senha">
                                Senha
                            </label>

                            <button type="button" id="togglePassword" class="button-link">
                                Mostrar
                            </button>

                        </div>

                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>

                    </div>


                    <div id="loginMessage" class="login-message" role="alert" aria-live="polite"></div>


                    <button type="submit" id="loginButton" class="login-button">

                        <span id="loginButtonText">
                            Entrar
                        </span>

                        <span
                            id="loginSpinner"
                            class="spinner"
                            hidden
                        ></span>

                    </button>


                    <button type="button" class="forgot-password" id="forgotPassword">
                        Esqueci minha senha
                    </button>

                </form>


                <div class="login-footer">

                    <span class="security-dot"></span>

                    <span>
                        Ambiente protegido e de acesso restrito.
                    </span>

                </div>

            </div>

        </section>

    </main>


    <!-- Biblioteca oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuração -->
    <script src="./js/config/supabase.js"></script>

    <!-- Sessão -->
    <script src="./js/auth/sessao.js"></script>

    <!-- Login -->
    <script src="./js/auth/login.js"></script>

</body>

</html>
